<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title> 
    
    <style>
        /* Basic reset and centering styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Style container holding the form */
        .signup-container {
            background-color: #f7f8f9;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #6db9ef;
            text-align: center;
        }
        /* Individual field container blocks */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #fafbfb;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        input:focus {
            border-color: #1804f1;
            outline: none;
        }
        /* Register button styling */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4dbeff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #0599fb;
        }
    </style>
    
</head>
<body>

<div class="signup-container">
    <h2>Sign Up</h2>
    <!-- The 'action' specifies where data is sent, 'method' keeps data hidden in submission -->
    <form action="/submit-registration" method="POST">
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
    </form>
</div>

</body>
</html>
